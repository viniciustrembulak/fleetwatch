[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fleetwatch"
version = "0.1.0"
description = "Monitor de integridade e desvio de configuração para frotas de servidores Linux via SSH, sem agente."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vinicius Trembulak" }]
keywords = ["security", "blue-team", "fim", "file-integrity", "drift-detection", "ssh", "linux"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "paramiko>=3.4",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
fleetwatch = "fleetwatch.cli:main"

[project.urls]
Repository = "https://github.com/viniciustrembulak/fleetwatch"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
